name: Deploy
# Publishes only commits that passed CI: runs when the CI workflow completes successfully for a
# push to main, and deploys that exact commit. workflow_dispatch is a manual override.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # `branches` matches the run's head branch name, which a fork PR can also call "main";
    # requiring a push event from this repository rules that out.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # Room for a cold figure render (about 4–8 min) plus the build.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run checks out the default branch's latest commit by default; deploy the one CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Pre-rendered frames are cached by content hash (D11): the key lists every image's hash, so an
      # unchanged figure is restored instead of rendered; a partial hit restores the newest cache and
      # renders only what changed.
      - run: npm run figures:keys
      - uses: actions/cache@v6
        with:
          path: .cache/figures
          key: figures-${{ hashFiles('figure-keys.txt') }}
          restore-keys: figures-
      - run: npm run render:figures
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
