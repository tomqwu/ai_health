name: Bug
description: Something is broken
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy:** this repository is public. Do **not** attach personal photos, body or health measurements or other health details here.
  - type: input
    id: url
    attributes: { label: Page URL }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: "What happened, and what did you expect?" }
    validations: { required: true }
